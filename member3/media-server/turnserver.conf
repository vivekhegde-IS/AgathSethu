# coturn TURN server - ONLY needed for viewers on the public internet behind
# symmetric NAT / strict firewalls. LAN and Tailscale viewers connect directly
# to MediaMTX's host candidates and do not use TURN.
#
# Run (Linux host or VM with a public IP):
#   docker run -d --name coturn --network host -v $PWD/turnserver.conf:/etc/coturn/turnserver.conf coturn/coturn
# Open on that host: 3478/udp+tcp, 5349/tcp (TLS) and the relay range 49160-49200/udp.
#
# Then
#  1. browsers:  member3/backend/.env
#       WEBRTC_ICE_SERVERS=[{"urls":["stun:turn.example.com:3478"]},
#                           {"urls":["turn:turn.example.com:3478?transport=udp","turns:turn.example.com:5349"],
#                            "username":"aghat","credential":"<TURN_PASSWORD>"}]
#  2. MediaMTX:  add to webrtcICEServers2 in mediamtx.yml
#       - url: turn:turn.example.com:3478
#         username: aghat
#         password: <TURN_PASSWORD>
#  3. serve the website over HTTPS (any non-localhost production deployment).

listening-port=3478
tls-listening-port=5349
# external-ip=<PUBLIC_IP>            # set when the host is behind 1:1 NAT (cloud VMs)
realm=turn.example.com
fingerprint
lt-cred-mech
user=aghat:CHANGE_ME_TURN_PASSWORD
min-port=49160
max-port=49200
no-multicast-peers
no-cli
# cert=/etc/coturn/fullchain.pem     # required for turns: (TLS on 5349)
# pkey=/etc/coturn/privkey.pem
# Never relay to private networks of the TURN host itself:
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
